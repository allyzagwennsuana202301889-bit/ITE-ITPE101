          description: AI answer and verified product recommendations
          content:
            application/json:
              schema:
                type: object
                required:
                  - answer
                  - products
                properties:
                  answer:
                    type: string
                  products:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                additionalProperties: true
              example:
                answer: Here are some art supplies that may help.
                products: []
        "400":
          description: Invalid or excessively long question
          content:
            application/json:
