          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
        "500":
          description: Webhook processing failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  requestBodies:
    GenericObject:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    CreateProduct:
      required: true
      description: Product details. All four core fields are required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProductInput"
    UpdateProduct:
      required: true
      description: Product fields to update; the server validates the merged product.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProductUpdateInput"
    InventoryAdjustment:
      required: true
      description: A non-zero stock change and its reason.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InventoryAdjustmentInput"
    OrderStatusUpdate:
      required: true
      description: The requested order status and optional note.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrderStatusInput"
    CreateCoupon:
      required: true
      description: Coupon configuration.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CouponInput"
    UpdateCoupon:
      required: true
      description: Only the coupon active state can be changed through this endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CouponUpdateInput"
    CreateCategory:
      required: true
      description: Category name and optional description.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CategoryInput"
    UpdateCategory:
      required: true
      description: Updated category name and optional description.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CategoryInput"
    CreateArtKit:
      required: true
      description: Art kit details and at least one product item.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ArtKitInput"
    UpdateArtKit:
      required: true
      description: Optional art kit details to update.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ArtKitUpdateInput"
  schemas:
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: REQUEST_ERROR
            message:
              type: string
              example: The request could not be completed.
        message:
          type: string
      additionalProperties: true
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
      additionalProperties: true
    ProductInput:
      type: object
      required:
        - name
        - category
        - price
        - stock
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
        category:
          type: string
          maxLength: 100
        price:
          type: number
          minimum: 0
        stock:
          type: integer
          minimum: 0
        description:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        isActive:
          type: boolean
          default: true
    ProductUpdateInput:
      allOf:
        - $ref: "#/components/schemas/ProductInput"
      description: Product fields are merged with the existing product before validation.
    InventoryAdjustmentInput:
      type: object
      required:
        - change
        - reason
      properties:
        change:
          type: integer
          minimum: -100000
          maximum: 100000
          not:
            enum:
              - 0
        reason:
          type: string
          minLength: 3
          maxLength: 255
    OrderStatusInput:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - pending_payment
            - paid
            - processing
            - shipped
            - completed
            - cancelled
            - refunded
        note:
          type: string
          maxLength: 255
      description: The API does not allow administrators to mark an order as paid;
        verified Maya processing handles that.
    CouponInput:
      type: object
      required:
        - code
        - discountType
        - discountValue
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9_-]{3,50}$
        discountType:
          type: string
          enum:
            - percentage
            - fixed
        discountValue:
          type: number
          exclusiveMinimum: 0
        minimumSpend:
          type: number
          minimum: 0
          default: 0
        usageLimit:
          type: integer
          minimum: 1
          nullable: true
        perCustomerLimit:
          type: integer
          minimum: 1
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        isActive:
          type: boolean
          default: true
    CouponUpdateInput:
      type: object
      properties:
        isActive:
          type: boolean
      additionalProperties: false
    CategoryInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          nullable: true
    ArtKitItemInput:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
    ArtKitInput:
      type: object
      required:
        - name
        - items
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          nullable: true
        kitType:
          type: string
          maxLength: 60
          nullable: true
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ArtKitItemInput"
    ArtKitUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          nullable: true
        kitType:
          type: string
          maxLength: 60
          nullable: true
    ArtKitResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: Example Art Kit
          additionalProperties: true
    InventoryAdjustmentResponse:
      type: object
      required:
        - success
        - product
        - adjustment
      properties:
        success:
          type: boolean
          example: true
        product:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: Watercolor Paint Set
            stock:
              type: integer
              example: 21
          additionalProperties: true
        adjustment:
          type: object
          required:
            - change
            - previousStock
            - newStock
            - reason
          properties:
            change:
              type: integer
              example: 1
            previousStock:
              type: integer
              example: 20
            newStock:
              type: integer
              example: 21
            reason:
              type: string
              example: Stock correction