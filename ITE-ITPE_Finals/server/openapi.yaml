                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
        "503":
          description: AI service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
  /api/v1/webhooks/maya:
    post:
      tags:
        - Payment Webhooks
      summary: Receive a Maya payment webhook
      description: Webhook authenticity is checked using the Maya signature and
        timestamp headers.
      parameters:
        - name: X-Maya-Webhook-Signature
          in: header
          required: true
          schema:
            type: string
        - name: X-Maya-Webhook-Timestamp
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Webhook processed, ignored, or recorded for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                message: Webhook processed.
        "400":
          description: Payment verification mismatch
          content:
