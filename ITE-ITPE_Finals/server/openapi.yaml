openapi: 3.0.3
info:
  title: Artistry API
  version: 1.0.0
  description: RESTful API documentation for the Artistry AI-Enhanced E-Commerce
    Application.
servers:
  - url: http://localhost:5000
    description: Local development server
tags:
  - name: General
  - name: Authentication
  - name: Products
  - name: Cart
  - name: Coupons
  - name: Checkout
  - name: Orders
  - name: Administration
  - name: Art Kits
  - name: Compatibility
  - name: AI Assistant
  - name: Payment Webhooks
paths:
  /:
    get:
      tags:
        - General
      summary: API welcome endpoint
      responses:
        "200":
          description: API information
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - version
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  version:
                    type: string
              example:
                success: true
                message: Welcome to the Artistry API!
                version: v1
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 120
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
      responses:
        "201":
          description: Account successfully registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                token: example-jwt-token
                user:
                  id: 1
                  name: Example Customer
                  email: customer@example.com
                  role: customer
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Log in to an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                token: <JWT>
                user:
                  id: 3
                  name: Example Customer
                  email: customer@example.com
                  role: customer
        "400":
          description: Required credentials are missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
        "429":
          description: Login rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
  /api/v1/auth/me:
    get:
      tags:
        - Authentication
      summary: Get the authenticated user's account
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                user:
                  id: 3
                  name: Example Customer
                  email: customer@example.com
                  role: customer
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
  /api/v1/products:
    get:
      tags:
        - Products
      summary: Retrieve active products
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          schema:
            type: number
            minimum: 0
        - name: sort
          in: query
          description: Allowed values are name, price, newest, and stock.
          schema:
            type: string
            enum:
              - name
              - price
              - newest
              - stock
        - name: direction
          in: query
          schema:
            type: string
            enum:
              - ASC
              - DESC
      responses:
        "200":
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                products:
                  - id: 1
                    name: Watercolor Paint Set
                    price: 450
                    stock: 20
                pagination:
                  page: 1
                  limit: 50
                  total: 1
                  pages: 1
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
  /api/v1/products/{id}:
    get:
      tags:
        - Products
      summary: Retrieve a product by ID
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                product:
                  id: 1
                  name: Watercolor Paint Set
                  price: 450
                  stock: 20
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
  /api/v1/categories:
    get:
      tags:
        - Products
      summary: Retrieve product categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                categories:
                  - id: 1
                    name: Painting
  /api/v1/cart:
    get:
      tags:
        - Cart
      summary: Retrieve the authenticated user's cart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cart contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                cart:
                  id: 1
                  items:
                    - id: 1
                      name: Watercolor Paint Set
                      price: 450
                      stock: 20
                      quantity: 1
                      lineTotal: 450
                  itemCount: 1
                  subtotal: 450
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
    delete:
      tags:
        - Cart
      summary: Clear the authenticated user's cart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cart cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                cart:
                  id: 1
                  items: []
                  itemCount: 0
                  subtotal: 0
  /api/v1/cart/items:
    post:
      tags:
        - Cart
      summary: Add a product to the cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
              properties:
                productId:
                  type: integer
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 99
                  default: 1
      responses:
        "201":
          description: Product added to cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                cart:
                  id: 1
                  items:
                    - id: 1
                      name: Example Watercolor Set
                      category: Painting
                      price: 450
                      stock: 20
                      imageUrl: null
                      quantity: 1
                      lineTotal: 450
                  itemCount: 1
                  subtotal: 450
        "400":
          description: Invalid product or quantity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
        "409":
          description: Insufficient stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
  /api/v1/cart/items/{productId}:
    patch:
      tags:
        - Cart
      summary: Update a cart item's quantity
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantity
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 99
      responses:
        "200":
          description: Cart updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                cart:
                  id: 1
                  items:
                    - id: 1
                      name: Watercolor Paint Set
                      price: 450
                      quantity: 2
                      lineTotal: 900
                  itemCount: 2
                  subtotal: 900
        "404":
          description: Cart item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
        "409":
          description: Insufficient stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
    delete:
      tags:
        - Cart
      summary: Remove a product from the cart
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cart updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                cart:
                  id: 1
                  items: []
                  itemCount: 0
                  subtotal: 0
  /api/v1/coupons/validate:
    post:
      tags:
        - Coupons
      summary: Validate a coupon
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - subtotal
              properties:
                code:
                  type: string
                subtotal:
                  type: number
                  minimum: 0
      responses:
        "200":
          description: Coupon validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                coupon:
                  code: EXAMPLE10
                  discountType: percentage
                  discountValue: 10
                discountAmount: 45
                subtotalAfterDiscount: 405
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
        "422":
          description: Coupon invalid or customer usage limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
  /api/v1/checkout:
    post:
      tags:
        - Checkout
      summary: Create a Maya checkout session
      description: The server calculates prices, discounts, shipping fees, and totals.
        An idempotency key is required.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shippingAddress
              properties:
                shippingAddress:
                  type: string
                  minLength: 10
                  maxLength: 1000
                couponCode:
                  type: string
      responses:
        "200":
          description: Existing checkout session returned for the same idempotency key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                message: Existing checkout session returned.
                idempotent: true
                checkoutUrl: https://example.invalid/checkout
                order:
                  id: 1
                  orderNumber: EXAMPLE-ORDER-001
                  status: pending_payment
                  subtotal: 450
                  discountAmount: 0
                  shippingFee: 80
                  total: 530
                  shippingAddress: Example shipping address
                  items: []
        "201":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                message: Maya Checkout created successfully.
                idempotent: false
                checkoutUrl: https://example.invalid/checkout
                order:
                  id: 1
                  orderNumber: EXAMPLE-ORDER-001
                  status: pending_payment
                  subtotal: 450
                  discountAmount: 0
                  shippingFee: 80
                  total: 530
                  shippingAddress: Example shipping address
                  items:
                    - productName: Watercolor Paint Set
                      quantity: 1
                      unitPrice: 450
                      lineTotal: 450
        "400":
          description: Invalid checkout details or idempotency key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
        "409":
          description: Checkout session unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
  /api/v1/orders:
    get:
      tags:
        - Orders
      summary: Retrieve the authenticated user's orders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer order list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                orders: []
  /api/v1/orders/{id}:
    get:
      tags:
        - Orders
      summary: Retrieve an order by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Order details and status history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                order:
                  id: 1
                  orderNumber: EXAMPLE-ORDER-001
                  status: pending_payment
                  items: []
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
  /api/v1/orders/{id}/retry-payment:
    post:
      tags:
        - Orders
      summary: Retry payment for an order
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Payment retry result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                message: A new Maya payment session has been created.
                checkoutUrl: https://example.invalid/checkout
                order:
                  id: 1
                  orderNumber: EXAMPLE-ORDER-001
                  status: pending_payment
                  total: 530
                  expiresAt: 2026-11-20T12:00:00.000Z
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
  /api/v1/orders/{id}/cancel:
    patch:
      tags:
        - Orders
      summary: Cancel an eligible order
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                message: Order cancelled successfully.
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
        "409":
          description: Order cannot be cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
  /api/v1/admin/dashboard:
    get:
      tags:
        - Administration
      summary: Retrieve dashboard statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                stats:
                  products: 26
                  customers: 4
                  orders: 19
                  revenue: 4610
                  lowStock: 1
                  pendingOrders: 2
                recentOrders: []
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
  /api/v1/admin/payment-mismatches:
    get:
      tags:
        - Administration
      summary: Retrieve payment mismatches
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Payment mismatch records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                mismatches: []
                pagination:
                  page: 1
                  limit: 20
                  total: 0
                  pages: 0
  /api/v1/admin/products:
    get:
      tags:
        - Administration
      summary: Retrieve products for administration
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                products:
                  - id: 1
                    name: Watercolor Paint Set
                    price: 450
                    stock: 20
                pagination:
                  page: 1
                  limit: 20
                  total: 1
                  pages: 1
    post:
      tags:
        - Administration
      summary: Create a product
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/CreateProduct"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                product:
                  id: 27
                  name: Example Art Product
                  category: Painting
                  price: 450
                  stock: 20
                  description: Illustrative product example
                  imageUrl: null
                  isActive: true
        "400":
          description: Invalid product data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
  /api/v1/admin/products/{id}:
    put:
      tags:
        - Administration
      summary: Update a product
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateProduct"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                product:
                  id: 1
                  name: Example Product
                  category: Painting
                  price: 450
                  stock: 20
        "400":
          description: Invalid product data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
    delete:
      tags:
        - Administration
      summary: Deactivate a product
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Product deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                message: Product deactivated.
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
  /api/v1/admin/inventory/{productId}/adjust:
    post:
      tags:
        - Administration
      summary: Adjust product inventory
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        $ref: "#/components/requestBodies/InventoryAdjustment"
      responses:
        "200":
          description: Inventory adjustment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryAdjustmentResponse"
              example:
                success: true
                product:
                  id: 1
                  name: Watercolor Paint Set
                  stock: 21
                adjustment:
                  change: 1
                  previousStock: 20
                  newStock: 21
                  reason: Stock correction
        "409":
          description: Invalid stock adjustment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: The request could not be completed.
  /api/v1/admin/inventory/adjustments:
    get:
      tags:
        - Administration
      summary: Retrieve inventory adjustment records
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Inventory adjustment history
          content:
