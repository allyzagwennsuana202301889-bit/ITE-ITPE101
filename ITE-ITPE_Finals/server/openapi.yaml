  /api/v1/art-kits/{id}/add-to-cart:
    post:
      tags:
        - Art Kits
      summary: Add an owned art kit's products to the existing cart
      description: >
        Adds each available product in the kit to the user's existing cart using
        the quantities saved in the kit. Inactive, out-of-stock, insufficient-stock
        (kit quantity plus quantity already in the cart) and over-99 lines are skipped
        and listed under "skipped". The cart still has to be reviewed and checked out normally.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Kit processed. Some or all products may have been skipped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                data:
                  kitId: 1
                  added:
                    - productId: 3
                      name: Digital Stylus Pen
                      quantity: 2
                      cartQuantity: 2
                  skipped:
                    - productId: 7
                      name: Stylus Nib Set
                      quantity: 5
                      reason: INSUFFICIENT_STOCK
                      message: "Stylus Nib Set: only 3 in stock, but the kit needs 5."
        "400":
          description: Invalid ID or empty kit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: This kit has no products to add.
        "404":
          description: Art kit not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                success: false
                error:
                  code: REQUEST_ERROR
                  message: Art kit not found.
